; L3. Передача информации во внешнюю среду
; Многозадачная архитектура FreeRTOS и публикация данных по MQTT
; Плата: Heltec WiFi Kit 32 (ESP32) | HC-SR04 | Arduino + FreeRTOS + PubSubClient

[env:heltec]
platform        = espressif32@^6.9.0   ; Arduino 2.0.17: автоопределение кварца (на плате 26 МГц, в 3.x зашито 40 МГц)
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
monitor_encoding = UTF-8
monitor_filters = direct
build_flags     = -Wall
lib_deps        =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

# Брокер MQTT для L3. Запуск из этой папки: docker compose up
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: l3-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config     # mosquitto.conf и (для варианта с паролем) passwd
    restart: unless-stopped
